<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trello Signup</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 flex items-center justify-center">

  <div class="w-full max-w-md bg-white/80 backdrop-blur-md rounded-2xl shadow-xl p-10 border border-gray-200">
    
    <!-- Logo -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-blue-600 tracking-wide">Trello</h1>
      <p class="text-gray-500 mt-2">Create your account</p>
    </div>

    <!-- Form -->
    <form class="space-y-6">
      <input
        type="text"
        placeholder="Full name"
        class="w-full border border-gray-300 rounded-xl px-5 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
      />

      <input
        type="email"
        placeholder="Email address"
        class="w-full border border-gray-300 rounded-xl px-5 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
      />

      <input
        type="password"
        placeholder="Password"
        class="w-full border border-gray-300 rounded-xl px-5 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
      />

      <button
        class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white py-3 rounded-xl font-semibold shadow-md hover:shadow-lg transition">
        Sign Up
      </button>
    </form>

    <!-- Footer -->
    <p class="text-center text-sm text-gray-600 mt-6">
      Already have an account?
      <a href="login.html" class="text-blue-600 font-semibold hover:underline transition">Log in</a>
    </p>

  </div>

</body>
</html>
